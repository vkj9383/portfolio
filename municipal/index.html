<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<title>KMC Municipal System</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one workspace with three persona views. Citizen = phone frame beside notes; ULB = kanban/list console; State = roll-up dashboard.
   Palette: cool paper greys, deep teal accent, semantic status colours kept separate from the accent. Type: Plex Sans for UI, Plex Mono for codes. */
:root{
  --bg:#edf0f3; --surface:#ffffff; --surface-2:#f5f7f9; --line:#d8dee5; --fg:#15202b; --muted:#566574;
  --accent:#0d6b65; --accent-ink:#ffffff; --accent-soft:#dbeeec;
  --good:#1a7a4a; --good-soft:#ddf2e6; --warn:#8f5f00; --warn-soft:#faedc9; --crit:#b3261e; --crit-soft:#fadfdc;
  --info:#2759ad; --info-soft:#e1eaf8; --neutral-soft:#e8ecf0;
  --shadow:0 1px 2px rgba(20,32,43,.06),0 4px 14px rgba(20,32,43,.06);
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e151c; --surface:#17202a; --surface-2:#1e2935; --line:#2c3947; --fg:#e6ecf2; --muted:#9aa9b8;
  --accent:#4cc2b7; --accent-ink:#06201e; --accent-soft:#17403d;
  --good:#52cf8e; --good-soft:#143827; --warn:#e5b455; --warn-soft:#3b3012; --crit:#ff8d83; --crit-soft:#431f1c;
  --info:#8fb5f6; --info-soft:#1c2c49; --neutral-soft:#25313e; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e151c; --surface:#17202a; --surface-2:#1e2935; --line:#2c3947; --fg:#e6ecf2; --muted:#9aa9b8;
  --accent:#4cc2b7; --accent-ink:#06201e; --accent-soft:#17403d;
  --good:#52cf8e; --good-soft:#143827; --warn:#e5b455; --warn-soft:#3b3012; --crit:#ff8d83; --crit-soft:#431f1c;
  --info:#8fb5f6; --info-soft:#1c2c49; --neutral-soft:#25313e; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--sans);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
h1,h2,h3,h4{margin:0;font-weight:600;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.mono{font-family:var(--mono);font-size:12px}
.muted{color:var(--muted)}
.wrap{max-width:1320px;margin:0 auto}
.top{max-width:1320px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding:16px 0}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand b{display:block;font-size:15px}.brand small{color:var(--muted);font-size:12px}
.mark{width:34px;height:34px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.personas{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.personas a{text-decoration:none;color:var(--muted);padding:7px 14px;border-radius:7px;font-weight:500;white-space:nowrap}
.personas a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 13px;cursor:pointer;font-weight:500;line-height:1.3}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 45%,var(--line))}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:500;white-space:nowrap}
.pill.neutral{background:var(--neutral-soft);color:var(--muted)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.chip{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;padding:0 6px;border-radius:4px}
.chip.crit{background:var(--crit-soft);color:var(--crit)}.chip.warn{background:var(--warn-soft);color:var(--warn)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.bar{height:6px;border-radius:99px;background:var(--neutral-soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.met>i{background:var(--good)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.view[hidden]{display:none}

/* citizen */
.cit{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:32px;align-items:start;justify-content:center;padding-top:8px}
.phone{background:var(--surface);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);overflow:hidden;min-height:640px;display:flex;flex-direction:column}
.p-head{padding:16px 16px 10px;background:var(--accent);color:var(--accent-ink)}
.p-head h2{font-size:17px}.p-head small{opacity:.85}
.p-tabs{display:flex;border-bottom:1px solid var(--line);background:var(--surface)}
.p-tabs button{flex:1;border:0;background:none;padding:11px 4px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
.p-tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.p-body{padding:14px;display:flex;flex-direction:column;gap:12px;flex:1}
.tk{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.tk h4{font-size:14.5px;line-height:1.35;cursor:pointer}
.tk .meta{color:var(--muted);font-size:12.5px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 11px;font-size:13px;cursor:pointer}
.fchip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.note{background:var(--accent-soft);color:var(--fg);border-radius:10px;padding:9px 12px;font-size:13px}
.note.warn{background:var(--warn-soft)}
.side h3{font-size:16px;margin-bottom:6px}.side p{margin:0 0 10px;color:var(--muted);max-width:60ch}
.side .card{padding:16px;margin-bottom:16px}
.side ol{margin:0;padding-left:18px;color:var(--muted)}.side li{margin-bottom:6px}
form.f{display:flex;flex-direction:column;gap:10px}
.f label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted);font-weight:500}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;color:var(--fg);width:100%;min-width:0}
.f textarea{min-height:76px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg label{flex:1;flex-direction:row;justify-content:center;padding:6px;cursor:pointer;color:var(--muted);text-align:center}
.seg input{position:absolute;opacity:0;width:0}
.seg label:has(input:checked){background:var(--accent-soft);color:var(--accent)}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:-2px}
.qrbox{width:96px;height:96px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px;flex:none}

/* ulb */
.console{padding-top:8px}
.ctitle{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 20px;margin-bottom:12px}
.ctitle h2{font-size:20px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:9px 14px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.tools input,.tools select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;min-width:0}
.kan{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.col{flex:0 0 260px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:140px}
.col.over{outline:2px dashed var(--accent);outline-offset:-2px}
.col h4{font-size:13px;display:flex;justify-content:space-between;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px;cursor:grab;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.tcard:hover{border-color:var(--accent)}
.tc-top{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tc-title{font-weight:500;line-height:1.35}
.tc-meta{color:var(--muted);font-size:12.5px}
.tc-foot{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:14px 6px}
.tblwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table.t{border-collapse:collapse;width:100%;min-width:640px}
table.t th,table.t td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
table.t th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600;white-space:nowrap}
table.t th button{border:0;background:none;font:inherit;text-transform:inherit;letter-spacing:inherit;color:inherit;cursor:pointer;padding:0}
table.t tr:last-child td{border-bottom:0}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums}
table.t tr.click{cursor:pointer}table.t tr.click:hover td{background:var(--surface-2)}

/* state */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.kpi{padding:14px 16px}.kpi small{color:var(--muted);display:block}.kpi b{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:16px;margin-bottom:16px}
.panel{padding:16px}.panel h3{font-size:15px;margin-bottom:10px}
.hb{display:grid;grid-template-columns:130px 1fr 34px;gap:10px;align-items:center;margin-bottom:8px;font-size:13px}
.hb .bar{height:10px;border-radius:3px}.hb .bar>i{border-radius:3px}

/* drawer + modal */
.scrim{position:fixed;inset:0;background:rgba(10,18,26,.5);z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--surface);z-index:31;box-shadow:-8px 0 30px rgba(0,0,0,.25);overflow-y:auto;padding:20px max(20px,env(safe-area-inset-right,0px)) 28px 20px;display:flex;flex-direction:column;gap:14px}
.drawer[hidden],.scrim[hidden],#modal[hidden]{display:none}
.drawer h3{font-size:18px;line-height:1.3}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:13.5px}.kv dt{color:var(--muted)}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.tl li{display:grid;grid-template-columns:14px 1fr;gap:10px;font-size:13px}
.tl li::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--accent);margin-top:5px}
.tl small{color:var(--muted);display:block}
#modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:16px;background:rgba(10,18,26,.55)}
.mbox{background:var(--surface);border-radius:14px;width:min(520px,100%);max-height:calc(100% - 8px);overflow-y:auto;padding:20px;box-shadow:var(--shadow)}
.mbox.wide{width:min(880px,100%)}
.mbox h3{font-size:17px;margin-bottom:12px}
.mact{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.merr{color:var(--crit);font-size:13px;margin:4px 0 0}
.steps{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.steps li{border:1px solid var(--line);border-radius:9px;padding:9px 12px;color:var(--muted)}
.steps li.on{border-color:var(--accent);color:var(--fg);background:var(--accent-soft)}
.steps li.done{color:var(--fg)}
.w360{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.tile{aspect-ratio:4/3;border-radius:8px;background:linear-gradient(135deg,var(--accent-soft),var(--neutral-soft));display:flex;align-items:flex-end;padding:6px;font-size:11.5px;color:var(--muted);max-width:100%}
#toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;max-width:min(560px,calc(100% - 32px));box-shadow:var(--shadow);font-size:13.5px}
#toast[hidden]{display:none}

@media (max-width:900px){
  .cit{grid-template-columns:minmax(0,1fr);gap:20px}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .phone{border-radius:20px}
}
@media (max-width:520px){.kv{grid-template-columns:1fr}.two{grid-template-columns:1fr}.personas{width:100%}.personas a{flex:1;text-align:center;padding:7px 6px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- full prototype additions ---- */
.top .tools2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-left:auto}
#who{display:flex;flex-direction:column;line-height:1.2;text-align:right;min-width:0}
.whoname{font-weight:600}.whorole{font-size:12px}
#x-switch{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:6px 8px;font:inherit;max-width:210px}
.personas{flex-wrap:wrap}
.personas a.lock{opacity:.55}
#x-bell .cnt{background:var(--crit);color:#fff;border-radius:99px;font-size:11px;padding:0 6px;margin-left:4px}
.login{max-width:760px;margin:10px auto;display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}.login .card{min-width:0}.login table{min-width:0!important}
.denied{max-width:720px;margin:20px auto}
.merr{color:var(--crit);margin:0;font-size:13px}
.sp{flex:1}
.empty{color:var(--muted);padding:14px;text-align:center}
.ctitle{display:flex;gap:12px;justify-content:space-between;align-items:flex-end;margin-bottom:12px}
.grid2.wide{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
input[type=text],input[type=date],input[type=number],input[type=search],input[type=password],input:not([type]),select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
textarea{min-height:88px;resize:vertical}
.chain{font-family:var(--mono);font-size:12px}
.fc{display:flex;gap:14px;align-items:flex-end;height:210px;padding:10px 4px 0;overflow-x:auto}
.fcol{flex:1 0 64px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.fcol b{font-size:12px;font-weight:600;white-space:nowrap}.fcol small{color:var(--muted)}
.fstack{width:100%;max-width:56px;display:flex;flex-direction:column-reverse;border-radius:4px;overflow:hidden;min-height:2px}
.fstack i{display:block;min-height:0}
.f-c{background:var(--accent)}.f-p{background:var(--info)}.f-r{background:var(--warn)}
.legend{margin-top:10px;font-size:12.5px;color:var(--muted);gap:16px}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}

.p-tabs button{white-space:nowrap;padding-left:8px;padding-right:8px;font-size:13px}
@media (max-width:760px){#who{text-align:left}.top .tools2{margin-left:0}}
.shot{margin:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}.shot img{display:block;width:100%;height:110px;object-fit:cover}.shot figcaption{padding:4px 8px;font-size:12px;display:flex;gap:6px;align-items:center;justify-content:space-between}
.crow{display:grid;grid-template-columns:1.1fr 1.6fr .6fr .6fr .8fr;gap:6px;margin-top:6px}.crow input,.crow select{min-width:0;width:100%}
@media (max-width:760px){.crow{grid-template-columns:1fr 1fr}}
.shot select{min-width:92px;padding:3px 6px}.crow{display:grid;grid-template-columns:130px minmax(0,1fr) 70px 70px 90px;gap:6px;margin-top:6px}@media (max-width:760px){.crow{grid-template-columns:1fr 1fr}}</style>

<header class="top">
  <div class="brand">
    <span class="mark" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6"/></svg></span>

</main>

<div class="scrim" id="scrim" hidden data-act="close-drawer"></div>

<script>
(function(){
'use strict';
var TODAY=new Date('2026-11-21T00:00:00Z');
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function inr(n){if(n==null)return '–';if(n>=1e7)return '₹'+(n/1e7).toFixed(2)+' Cr';if(n>=1e5)return '₹'+(n/1e5).toFixed(1)+' lakh';return '₹'+Number(n).toLocaleString('en-IN')}
function dfmt(iso){return iso?new Date(iso+'T00:00:00Z').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'}):'–'}
function addDays(iso,n){var d=new Date(iso+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
function diffDays(a,b){return Math.round((new Date(b+'T00:00:00Z')-new Date(a+'T00:00:00Z'))/864e5)}
var TODAY_ISO='2026-11-21';

/* ---------- pseudo QR ---------- */
function qr(seed){
 var s=0,i;for(i=0;i<seed.length;i++)s=(s*31+seed.charCodeAt(i))>>>0;if(!s)s=1;
 function rnd(){s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296}
 var out='';
 for(var y=0;y<21;y++)for(var x=0;x<21;x++){
  if((x<8&&y<8)||(x>12&&y<8)||(x<8&&y>12))continue;
  if(rnd()>0.52)out+='<rect x="'+x+'" y="'+y+'" width="1" height="1"/>';
 }
 function finder(x,y){return '<rect x="'+x+'" y="'+y+'" width="7" height="7"/><rect x="'+(x+1)+'" y="'+(y+1)+'" width="5" height="5" fill="var(--surface)"/><rect x="'+(x+2)+'" y="'+(y+2)+'" width="3" height="3"/>'}
 return '<svg viewBox="-1 -1 23 23" fill="currentColor" role="img" aria-label="Sample QR pattern, not scannable">'+out+finder(0,0)+finder(14,0)+finder(0,14)+'</svg>';
}

function checkThreshold(t){
 if(t.status==='open_for_voting'&&t.votes>=t.need){
  t.status='ulb_review';t.route='votes';t.wait=0;ev(t,'System','Vote threshold met ('+t.votes+' of '+t.need+'), sent to ULB review');
  toast('Threshold met on '+t.id+'. It is now in the ULB review queue.');
 }
}
function vote(id){
 var t=T(id);if(!t||t.status!=='open_for_voting')return;
 if(t.ulb!==S.me.ulb||t.ward!==S.me.ward){toast('Only residents of '+t.ward+' can vote on this ticket.');return}
 var i=S.me.voted.indexOf(id);
 if(i>=0){S.me.voted.splice(i,1);t.votes--}else{S.me.voted.push(id);t.votes++}
 checkThreshold(t);
}
function guardTicket(t,to,ctx){
 var from=t.status;if(from===to)return {ok:false};
 var fi=TORDER.indexOf(from),ti=TORDER.indexOf(to);
 if(ti<fi)return {ok:false,msg:'Tickets only move forward. Use Return to review in the ticket panel to send one back.'};
 if(from==='new'&&to==='open_for_voting')return {ok:true,run:function(){openVoting(t)}};
 if((from==='new'||from==='open_for_voting')&&to==='ulb_review')return {ok:true,ask:'fasttrack'};
 if(from==='ulb_review'&&to==='awaiting_sanction')return {ok:true,ask:'approve'};
 if(from==='awaiting_sanction'&&to==='scheduled'){return ctx==='state'?{ok:true,ask:'sanction'}:{ok:false,msg:'Sanction is decided by the district or state authority. Open the State dashboard to act on it.'}}
 if(to==='in_progress'||to==='completed')return {ok:false,msg:'These columns follow the linked work. Move the work on the Works board.'};
 return {ok:false,msg:'That move skips a step. Tickets go New, Open for voting, ULB review, Awaiting sanction, Scheduled.'};
}

/* ---------- hash-chained audit log ---------- */
function h32(s){var h=2166136261>>>0;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return h>>>0}
function hx(s){return h32(s).toString(16).padStart(8,'0')+h32(s+'#1').toString(16).padStart(8,'0')}
function log(action,detail,actor,at){
 var c=S.chain,prev=c.length?c[c.length-1].hash:'0000000000000000',n=c.length+1;
 actor=actor||U().name;
 var e={n:n,at:at||TODAY_ISO,actor:actor,action:action,detail:detail,prev:prev};
 e.hash=hx(prev+'|'+n+'|'+actor+'|'+action+'|'+detail);c.push(e);return e;
}
function verifyChain(){
 var prev='0000000000000000';
 for(var i=0;i<S.chain.length;i++){
  var e=S.chain[i];
  if(e.prev!==prev)return {ok:false,at:e.n,why:'link to the previous entry does not match'};
  if(hx(e.prev+'|'+e.n+'|'+e.actor+'|'+e.action+'|'+e.detail)!==e.hash)return {ok:false,at:e.n,why:'the content no longer matches its recorded hash'};
  prev=e.hash;
 }
 return {ok:true,n:S.chain.length,head:prev};
}

var MONTHS=[['2026-11','Nov'],['2026-12','Dec'],['2027-01','Jan'],['2027-02','Feb'],['2027-03','Mar']];
var PINW={'700029':{'Ward 12':0.6,'Ward 14':0.4},'700019':{'Ward 9':1},'700026':{'Ward 12':1}};
function mi(iso){var m=iso.slice(0,7);for(var i=0;i<MONTHS.length;i++)if(MONTHS[i][0]===m)return i;return iso<'2026-11'?0:MONTHS.length-1}
var SCEN={base:{pw:0.9,pt:0.7,rec:1},high:{pw:1,pt:1,rec:1.2},low:{pw:0.5,pt:0.4,rec:0.9}};
function fcWorks(filter,scen){
 var out=MONTHS.map(function(){return {c:0,p:0,r:0}}),s=SCEN[scen];
 S.works.forEach(function(w){
  if(w.ulb!=='KMC'||!filter(w.ward)||w.status==='completed')return;
  if(w.contract){
   var rem=Math.max(0,w.contract-w.paid);if(!rem)return;
   var a=Math.max(0,mi(w.start&&w.start>TODAY_ISO?w.start:TODAY_ISO)),b=Math.max(a,mi(w.end||'2027-03-31'));if(w.end&&w.end<TODAY_ISO)b=Math.min(MONTHS.length-1,a+1);
   var n=b-a+1;for(var i=a;i<=b;i++)out[i].c+=rem/n;
  }else{
   var amt=(w.sanctioned||0)*s.pw,a2=Math.min(MONTHS.length-1,mi(w.start||TODAY_ISO)+1),b2=Math.min(MONTHS.length-1,a2+2),n2=b2-a2+1;for(var j=a2;j<=b2;j++)out[j].p+=amt/n2;
  }
 });
 S.tickets.forEach(function(t){if(t.ulb==='KMC'&&t.status==='awaiting_sanction'&&filter(t.ward)&&t.cost){var amt=t.cost*s.pt;for(var i=2;i<=4;i++)out[i].p+=amt/3}});
 return out;
}
function fcRecurring(wards,scen,out,withOthers){
 var s=SCEN[scen];
 wards.forEach(function(w){var m=(ROUTINE[w]||{m:0}).m;MONTHS.forEach(function(x,i){out[i].r+=m*s.rec*(i===4?1.5:1)})});
 if(withOthers)MONTHS.forEach(function(x,i){out[i].r+=141*300000*s.rec*(i===4?1.5:1)});
}
function forecast(level,node,scen){
 var known=['Ward 9','Ward 12','Ward 14'],out,note='',avail=null;
 if(level==='ward'){out=fcWorks(function(w){return w===node},scen);fcRecurring([node],scen,out,false);var wb=wardBudget(node);avail=wb.alloc-wb.spent}
 else if(level==='pin'){
  out=MONTHS.map(function(){return {c:0,p:0,r:0}});var wt=PINW[node]||{};
  Object.keys(wt).forEach(function(w){var f=fcWorks(function(x){return x===w},scen);fcRecurring([w],scen,f,false);f.forEach(function(m,i){out[i].c+=m.c*wt[w];out[i].p+=m.p*wt[w];out[i].r+=m.r*wt[w]})});
  note='A PIN code does not follow ward boundaries. Each ward\'s amount is split by an assumed share of the PIN area, so this view is approximate.';
 }else{
  out=fcWorks(function(){return true},scen);fcRecurring(known,scen,out,true);
  if(level==='state'){out=out.map(function(m){return {c:m.c*3.4,p:m.p*3.4,r:m.r*3.4}});note='State and district values are scaled up from the KMC sample (district) and the KMC sample times 3.4 (state). A real forecast adds every ULB.'}
  if(level==='district')note='Kolkata district is served by one ULB, so this equals the KMC forecast.';
 }
 return {m:out,note:note,avail:avail};
}
function fcLabelFor(level,node){return level==='ward'?node:level==='pin'?'PIN '+node:level==='ulb'?'Kolkata Municipal Corporation':level==='district'?'Kolkata district':'West Bengal'}

var CHAT={m:[],step:'menu',d:{}};
function chBot(t,btns){CHAT.m.push({from:'bot',t:t,b:btns||null})}
function chMenu(){chBot(tx('Namaste! This is the KMC helpline (sample). Tap a button or type a number.'),['1  Report a problem','2  Track a ticket','3  My notices','4  Talk to a person']);CHAT.step='menu'}

 text=String(text||'').trim();if(!text)return;
 if(CHAT.step==='desc'&&(text==='Send voice note (demo)'||text===tx('Send voice note (demo)')))text=(VOICE_SAMPLE[eff()]||VOICE_SAMPLE.en);
 CHAT.m.push({from:'me',t:text});var st=CHAT.step,n=text.charAt(0),d=CHAT.d;
 if(st==='menu'){
  if(n==='1'){chBot(tx('What kind of problem is it?'),CATS);CHAT.step='cat';CHAT.d={}}
  else if(n==='2'){chBot(tx('Please send the ticket number, for example T-1042.'));CHAT.step='track'}
  else if(n==='3'){var k=(S.notices||[]).filter(function(x){return x.status!=='in_review'}).length;chBot(tx('You have {n} notices from KMC. Open the Notices tab to read them.').replace('{n}',k));chMenu()}
  else if(n==='4'){chBot(tx('A call-back from the ward office has been requested. Expect a call within 1 working day.'));chMenu()}
  else chBot(tx('Say the number 1 to 4, or tap a button.'),['1  Report a problem','2  Track a ticket','3  My notices','4  Talk to a person']);
 }else if(st==='cat'){
  var c=CATS.filter(function(x){return x.toLowerCase()===text.toLowerCase()||tx(x)===text})[0]||CATS[parseInt(text,10)-1]||'Roads';
  d.cat=c;chBot(tx('Which road or landmark?'));CHAT.step='road';
 }else if(st==='road'){d.road=text;chBot(tx('Describe the problem. You can also send a voice note.'),['Send voice note (demo)']);CHAT.step='desc'}
 else if(st==='desc'){d.desc=text;chBot(tx('Send a photo (demo)')+'?',['Send a photo (demo)','Skip']);CHAT.step='photo'}

  if(text===tx('Send a photo (demo)')){d.photos=1;chBot(tx('Photo received.'))}

  var t=T(text.toUpperCase().replace(/\s/g,''));

  if(inPoly(x,y,p)&&inPoly(x+8,y,p)&&inPoly(x-8,y,p)&&inPoly(x,y+8,p)&&inPoly(x,y-8,p))return [x,y]}

 if(act==='cw-hold'){var d2=S.digs.filter(function(x){return x.id===c.B.id})[0];if(d2)d2.permit='held';cwSet(c,'talking','Permit held until the dates are agreed');log('clash.hold','Dig permit '+c.B.id+' held because of a clash on '+c.road);toast('The dig permit is on hold.');render();return}
 if(act==='cw-dismiss'){modal('Not a clash','<div class="f"><label>Why<textarea name="n" placeholder="For example: the dig is on the opposite carriageway"></textarea></label></div>',{submit:'Mark as not a clash',onSubmit:function(fd){var n=String(fd.get('n')||'').trim();if(n.length<10)return 'Give a reason of at least 10 characters.';cwSet(c,'dismissed',n);log('clash.dismiss','Clash on '+c.road+' ('+c.key+') marked not a clash: '+n)}});return}
 if(act==='cw-approve'){modal('Approve with conditions','<p class="muted" style="margin:0 0 8px">'+esc(c.msg)+'</p><div class="f"><label>Reason (for example an emergency leak)<textarea name="n"></textarea></label><label>Conditions<textarea name="c">Restore the full width of the surface within 7 days. Guarantee the repair for 2 years. Inspect before closing the trench.</textarea></label></div>',{submit:'Approve',onSubmit:function(fd){var n=String(fd.get('n')||'').trim(),cc=String(fd.get('c')||'').trim();if(n.length<10)return 'Give a reason of at least 10 characters.';if(cc.length<10)return 'State the conditions.';cwSet(c,'approved',n+' Conditions: '+cc);var d3=S.digs.filter(function(x){return x.id===c.B.id})[0];if(d3)d3.permit='approved';log('clash.approve','Dig '+c.B.id+' on '+c.road+' approved despite clash. '+n+' Conditions: '+cc)}});return}
 if(act==='cw-move'){
  var d4=S.digs.filter(function(x){return x.id===c.B.id})[0];if(!d4){toast('Only digs in this city can be moved here.');return}
  var L=dd(d4.from,d4.to),early=addDays(c.A.from,-L-4),sug=early>=addDays(TODAY_ISO,7)?early:addDays(c.A.to,MORAT+1);
  modal('Move the dig dates','<p class="muted" style="margin:0 0 8px">'+esc(c.road)+': '+esc(c.A.what)+' runs '+dfmt(c.A.from)+' to '+dfmt(c.A.to)+'. Suggested start: <b>'+dfmt(sug)+'</b> ('+(sug===early?'finishes before the surface work starts':'after the no-cut period')+').</p><div class="f"><div class="two"><label>From<input type="date" name="f" value="'+sug+'"></label><label>To<input type="date" name="t" value="'+addDays(sug,L)+'"></label></div></div>',{submit:'Move the dates',onSubmit:function(fd){var f=fd.get('f'),t=fd.get('t');if(!f||!t||t<f)return 'The end date is before the start date.';var old=d4.from+' to '+d4.to;d4.from=f;d4.to=t;var again=cwScan().filter(function(x){return x.B.id===d4.id&&(x.sev==='critical'||x.sev==='high'||x.sev==='medium')})[0];log('clash.reschedule','Dig '+d4.id+' on '+d4.road+' moved from '+old+' to '+f+' to '+t+(again?' (still clashes)':''));toast(again?'Moved, but the new dates still clash. See the list.':'Moved. The clash is cleared.');if(!again)cwSet(c,'rescheduled','Dig moved to '+f+' to '+t)}});return}
});
/* the agency's existing "Add planned digging" now goes through the permit check */
document.addEventListener('click',function(e){
 var a=e.target.closest&&e.target.closest('[data-act="x-dig"]');if(!a)return;e.stopImmediatePropagation();
 var roads=Object.keys(WROAD).map(function(k){return WROAD[k]}).concat(['Lake Road']).filter(function(x,i,l){return l.indexOf(x)===i});
 modal('Ask for a dig permit','<div class="f"><label>Road<select name="r">'+roads.map(function(r){return '<option>'+r+'</option>'}).join('')+'</select></label><div class="two"><label>From<input type="date" name="f" value="'+addDays(TODAY_ISO,14)+'"></label><label>To<input type="date" name="t" value="'+addDays(TODAY_ISO,18)+'"></label></div><label>Work<input name="w" placeholder="For example: cable laying"></label><label class="row" style="flex-direction:row;gap:8px"><input type="checkbox" name="em" style="width:auto"> Emergency repair (leak, burst or fault)</label></div><p class="muted" style="font-size:12.5px">The dates are checked against works and recent resurfacing before the request is sent.</p>',{submit:'Ask for the permit',onSubmit:function(fd){
  var f=fd.get('f'),t=fd.get('t'),w=String(fd.get('w')||'').trim(),r=String(fd.get('r')),em=!!fd.get('em');if(!f||!t||t<f)return 'The end date is before the start date.';if(w.length<4)return 'Describe the work.';
  var cand={id:'DG-NEW',src:'dig',kind:'trench',road:r,ward:'Ward 12',ulb:'KMC',from:f,to:t,what:w,agency:U().agency,cost:0,permit:'requested'};
  var hits=cwScan([cand]).filter(function(c){return c.B.id==='DG-NEW'&&c.sev!=='info'}),bad=hits.filter(function(c){return c.sev==='critical'||c.sev==='high'})[0];
  if(bad&&!em)return bad.msg+' '+(bad.fix?'Suggested: '+bad.fix+'.':'');
  var d={id:'DG-'+(300+S.digs.length),road:r,ward:'Ward 12',from:f,to:t,what:w,agency:U().agency,permit:'requested',emergency:em};S.digs.push(d);
  log('agency.plan',U().agency+' asked for a dig permit '+d.id+' on '+r+' '+f+' to '+t+(em?' (emergency)':'')+(hits.length?' with a clash flagged':''));
  if(hits.length)notify('Clash flagged on '+r+': '+U().agency+' asked to dig '+dfmt(f)+' to '+dfmt(t)+'.','ticket');
  toast(hits.length?'Sent, with the clash flagged for the ULB engineer.':'Permit request sent. No clash found.');}});
},true);
/* admin setting for the no-cut period */
(function(){var _s=seedTasks;seedTasks=function(){_s();S.cw=null;CWD()}})();


init();render();
})();

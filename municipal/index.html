<title>KMC Municipal System</title>

<style>
/* Layout: one workspace with three persona views. Citizen = phone frame beside notes; ULB = kanban/list console; State = roll-up dashboard.
   Palette: cool paper greys, deep teal accent, semantic status colours kept separate from the accent. Type: Plex Sans for UI, Plex Mono for codes. */
:root{
  --bg:#edf0f3; --surface:#ffffff; --surface-2:#f5f7f9; --line:#d8dee5; --fg:#15202b; --muted:#566574;
  --accent:#0d6b65; --accent-ink:#ffffff; --accent-soft:#dbeeec;
  --good:#1a7a4a; --good-soft:#ddf2e6; --warn:#8f5f00; --warn-soft:#faedc9; --crit:#b3261e; --crit-soft:#fadfdc;
  --info:#2759ad; --info-soft:#e1eaf8; --neutral-soft:#e8ecf0;
  --shadow:0 1px 2px rgba(20,32,43,.06),0 4px 14px rgba(20,32,43,.06);
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e151c; --surface:#17202a; --surface-2:#1e2935; --line:#2c3947; --fg:#e6ecf2; --muted:#9aa9b8;
  --accent:#4cc2b7; --accent-ink:#06201e; --accent-soft:#17403d;
  --good:#52cf8e; --good-soft:#143827; --warn:#e5b455; --warn-soft:#3b3012; --crit:#ff8d83; --crit-soft:#431f1c;
  --info:#8fb5f6; --info-soft:#1c2c49; --neutral-soft:#25313e; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e151c; --surface:#17202a; --surface-2:#1e2935; --line:#2c3947; --fg:#e6ecf2; --muted:#9aa9b8;
  --accent:#4cc2b7; --accent-ink:#06201e; --accent-soft:#17403d;
  --good:#52cf8e; --good-soft:#143827; --warn:#e5b455; --warn-soft:#3b3012; --crit:#ff8d83; --crit-soft:#431f1c;
  --info:#8fb5f6; --info-soft:#1c2c49; --neutral-soft:#25313e; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--sans);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
h1,h2,h3,h4{margin:0;font-weight:600;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.mono{font-family:var(--mono);font-size:12px}
.muted{color:var(--muted)}
.wrap{max-width:1320px;margin:0 auto}
.top{max-width:1320px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding:16px 0}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand b{display:block;font-size:15px}.brand small{color:var(--muted);font-size:12px}
.mark{width:34px;height:34px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.personas{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.personas a{text-decoration:none;color:var(--muted);padding:7px 14px;border-radius:7px;font-weight:500;white-space:nowrap}
.personas a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 13px;cursor:pointer;font-weight:500;line-height:1.3}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 45%,var(--line))}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:500;white-space:nowrap}
.pill.neutral{background:var(--neutral-soft);color:var(--muted)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.chip{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;padding:0 6px;border-radius:4px}
.chip.crit{background:var(--crit-soft);color:var(--crit)}.chip.warn{background:var(--warn-soft);color:var(--warn)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.bar{height:6px;border-radius:99px;background:var(--neutral-soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.met>i{background:var(--good)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.view[hidden]{display:none}

/* citizen */
.cit{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:32px;align-items:start;justify-content:center;padding-top:8px}
.phone{background:var(--surface);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);overflow:hidden;min-height:640px;display:flex;flex-direction:column}
.p-head{padding:16px 16px 10px;background:var(--accent);color:var(--accent-ink)}
.p-head h2{font-size:17px}.p-head small{opacity:.85}
.p-tabs{display:flex;border-bottom:1px solid var(--line);background:var(--surface)}
.p-tabs button{flex:1;border:0;background:none;padding:11px 4px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
.p-tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.p-body{padding:14px;display:flex;flex-direction:column;gap:12px;flex:1}
.tk{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.tk h4{font-size:14.5px;line-height:1.35;cursor:pointer}
.tk .meta{color:var(--muted);font-size:12.5px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 11px;font-size:13px;cursor:pointer}
.fchip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.note{background:var(--accent-soft);color:var(--fg);border-radius:10px;padding:9px 12px;font-size:13px}
.note.warn{background:var(--warn-soft)}
.side h3{font-size:16px;margin-bottom:6px}.side p{margin:0 0 10px;color:var(--muted);max-width:60ch}
.side .card{padding:16px;margin-bottom:16px}
.side ol{margin:0;padding-left:18px;color:var(--muted)}.side li{margin-bottom:6px}
form.f{display:flex;flex-direction:column;gap:10px}
.f label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted);font-weight:500}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;color:var(--fg);width:100%;min-width:0}
.f textarea{min-height:76px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg label{flex:1;flex-direction:row;justify-content:center;padding:6px;cursor:pointer;color:var(--muted);text-align:center}
.seg input{position:absolute;opacity:0;width:0}
.seg label:has(input:checked){background:var(--accent-soft);color:var(--accent)}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:-2px}
.qrbox{width:96px;height:96px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px;flex:none}

/* ulb */
.console{padding-top:8px}
.ctitle{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 20px;margin-bottom:12px}
.ctitle h2{font-size:20px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:9px 14px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.tools input,.tools select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;min-width:0}
.kan{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.col{flex:0 0 260px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:140px}
.col.over{outline:2px dashed var(--accent);outline-offset:-2px}
.col h4{font-size:13px;display:flex;justify-content:space-between;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px;cursor:grab;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.tcard:hover{border-color:var(--accent)}
.tc-top{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tc-title{font-weight:500;line-height:1.35}
.tc-meta{color:var(--muted);font-size:12.5px}
.tc-foot{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:14px 6px}
.tblwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table.t{border-collapse:collapse;width:100%;min-width:640px}
table.t th,table.t td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
table.t th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600;white-space:nowrap}
table.t th button{border:0;background:none;font:inherit;text-transform:inherit;letter-spacing:inherit;color:inherit;cursor:pointer;padding:0}
table.t tr:last-child td{border-bottom:0}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums}
table.t tr.click{cursor:pointer}table.t tr.click:hover td{background:var(--surface-2)}

/* state */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.kpi{padding:14px 16px}.kpi small{color:var(--muted);display:block}.kpi b{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:16px;margin-bottom:16px}
.panel{padding:16px}.panel h3{font-size:15px;margin-bottom:10px}
.hb{display:grid;grid-template-columns:130px 1fr 34px;gap:10px;align-items:center;margin-bottom:8px;font-size:13px}
.hb .bar{height:10px;border-radius:3px}.hb .bar>i{border-radius:3px}

/* drawer + modal */
.scrim{position:fixed;inset:0;background:rgba(10,18,26,.5);z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--surface);z-index:31;box-shadow:-8px 0 30px rgba(0,0,0,.25);overflow-y:auto;padding:20px max(20px,env(safe-area-inset-right,0px)) 28px 20px;display:flex;flex-direction:column;gap:14px}
.drawer[hidden],.scrim[hidden],#modal[hidden]{display:none}
.drawer h3{font-size:18px;line-height:1.3}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:13.5px}.kv dt{color:var(--muted)}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.tl li{display:grid;grid-template-columns:14px 1fr;gap:10px;font-size:13px}
.tl li::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--accent);margin-top:5px}
.tl small{color:var(--muted);display:block}
#modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:16px;background:rgba(10,18,26,.55)}
.mbox{background:var(--surface);border-radius:14px;width:min(520px,100%);max-height:calc(100% - 8px);overflow-y:auto;padding:20px;box-shadow:var(--shadow)}
.mbox.wide{width:min(880px,100%)}
.mbox h3{font-size:17px;margin-bottom:12px}
.mact{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.merr{color:var(--crit);font-size:13px;margin:4px 0 0}
.steps{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.steps li{border:1px solid var(--line);border-radius:9px;padding:9px 12px;color:var(--muted)}
.steps li.on{border-color:var(--accent);color:var(--fg);background:var(--accent-soft)}
.steps li.done{color:var(--fg)}
.w360{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.tile{aspect-ratio:4/3;border-radius:8px;background:linear-gradient(135deg,var(--accent-soft),var(--neutral-soft));display:flex;align-items:flex-end;padding:6px;font-size:11.5px;color:var(--muted);max-width:100%}
#toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;max-width:min(560px,calc(100% - 32px));box-shadow:var(--shadow);font-size:13.5px}
#toast[hidden]{display:none}

@media (max-width:900px){
  .cit{grid-template-columns:minmax(0,1fr);gap:20px}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .phone{border-radius:20px}
}
@media (max-width:520px){.kv{grid-template-columns:1fr}.two{grid-template-columns:1fr}.personas{width:100%}.personas a{flex:1;text-align:center;padding:7px 6px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

/* ---------- pseudo QR ---------- */
function qr(seed){
 var s=0,i;for(i=0;i<seed.length;i++)s=(s*31+seed.charCodeAt(i))>>>0;if(!s)s=1;
 function rnd(){s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296}
 var out='';
 for(var y=0;y<21;y++)for(var x=0;x<21;x++){
  if((x<8&&y<8)||(x>12&&y<8)||(x<8&&y>12))continue;
  if(rnd()>0.52)out+='<rect x="'+x+'" y="'+y+'" width="1" height="1"/>';
 }
 function finder(x,y){return '<rect x="'+x+'" y="'+y+'" width="7" height="7"/><rect x="'+(x+1)+'" y="'+(y+1)+'" width="5" height="5" fill="var(--surface)"/><rect x="'+(x+2)+'" y="'+(y+2)+'" width="3" height="3"/>'}
 return '<svg viewBox="-1 -1 23 23" fill="currentColor" role="img" aria-label="Sample QR pattern, not scannable">'+out+finder(0,0)+finder(14,0)+finder(0,14)+'</svg>';
}

function checkThreshold(t){

  t.status='ulb_review';t.route='votes';t.wait=0;ev(t,'System','Vote threshold met ('+t.votes+' of '+t.need+'), sent to ULB review');

function vote(id){
 var t=T(id);if(!t||t.status!=='open_for_voting')return;
 if(t.ulb!==S.me.ulb||t.ward!==S.me.ward){toast('Only residents of '+t.ward+' can vote on this ticket.');return}
 var i=S.me.voted.indexOf(id);
 if(i>=0){S.me.voted.splice(i,1);t.votes--}else{S.me.voted.push(id);t.votes++}
 checkThreshold(t);
}
function guardTicket(t,to,ctx){
 var from=t.status;if(from===to)return {ok:false};
 var fi=TORDER.indexOf(from),ti=TORDER.indexOf(to);
 if(ti<fi)return {ok:false,msg:'Tickets only move forward. Use Return to review in the ticket panel to send one back.'};
 if(from==='new'&&to==='open_for_voting')return {ok:true,run:function(){openVoting(t)}};
 if((from==='new'||from==='open_for_voting')&&to==='ulb_review')return {ok:true,ask:'fasttrack'};
 if(from==='ulb_review'&&to==='awaiting_sanction')return {ok:true,ask:'approve'};
 if(from==='awaiting_sanction'&&to==='scheduled'){return ctx==='state'?{ok:true,ask:'sanction'}:{ok:false,msg:'Sanction is decided by the district or state authority. Open the State dashboard to act on it.'}}
 if(to==='in_progress'||to==='completed')return {ok:false,msg:'These columns follow the linked work. Move the work on the Works board.'};
 return {ok:false,msg:'That move skips a step. Tickets go New, Open for voting, ULB review, Awaiting sanction, Scheduled.'};
}

 var h='<div class="mbox wide" role="dialog" aria-modal="true" aria-label="View 360"><div class="row"><span class="mono">'+w.code+'</span>'+pill(WS[w.status].pill,WS[w.status].label)+(delay?'<span class="chip crit">'+delay+' days late</span>':'')+'<span class="sp"></span><button class="btn sm" data-act="close-modal">Close</button></div><h3 style="margin:8px 0 12px">'+esc(w.title)+'</h3><div class="tabs" role="tablist">'+tabs.map(function(x){return '<button role="tab" aria-selected="'+(UI.w360Tab===x[0])+'" data-act="w-tab" data-tab="'+x[0]+'">'+x[1]+'</button>'}).join('')+'</div>';
 var tab=UI.w360Tab;
 if(tab==='overview'){
  h+='<dl class="kv"><dt>Org path</dt><dd>West Bengal › Kolkata › KMC › '+esc(w.ward)+'</dd><dt>Category</dt><dd>'+esc(w.cat)+'</dd><dt>Engineer</dt><dd>'+esc(w.engineer)+'</dd><dt>Sanctioned</dt><dd>'+inr(w.sanctioned)+'</dd><dt>Contract</dt><dd>'+inr(w.contract)+'</dd><dt>Schedule</dt><dd>'+dfmt(w.start)+' to '+dfmt(w.end)+'</dd>'+(w.hold?'<dt>On hold</dt><dd>'+esc(w.hold)+'</dd>':'')+(w.ticket?'<dt>Origin</dt><dd>Community ticket <a href="#" data-act="open-ticket" data-id="'+w.ticket+'" data-ctx="ulb">'+w.ticket+'</a></dd>':'')+'</dl><div style="margin:14px 0 4px" class="row" ><b>'+w.progress+'% complete</b></div>'+bar(w.progress,100);
  h+='<div class="row" style="margin-top:14px"><button class="btn" data-act="w-inspect" '+(w.progress>=100||w.status==='planned'||w.status==='tendered'||w.status==='awarded'?'disabled':'')+'>Record inspection (+15%)</button></div>';
 }else if(tab==='timeline'){h+=timeline(w.events)}
 else if(tab==='tender'){
  h+='<dl class="kv"><dt>Notice (NIT)</dt><dd>'+esc(w.nit||'Not yet published')+'</dd><dt>Vendor</dt><dd>'+esc(w.vendor||'Not awarded')+'</dd><dt>Contract amount</dt><dd>'+inr(w.contract)+'</dd><dt>External reference</dt><dd>'+(w.nit?'State e-procurement portal, linked':'None')+'</dd></dl>';
  if(!w.vendor)h+='<div class="row" style="margin-top:14px"><button class="btn primary" data-act="w-award">Record sample award</button><span class="muted">Adds a winning bid so the work can move to Awarded.</span></div>';
 }else if(tab==='finance'){
  var rows=[['Sanctioned',w.sanctioned||0],['Contract',w.contract||0],['Billed',w.billed],['Paid',w.paid]],mx=Math.max(w.sanctioned||1,1);
  h+=rows.map(function(r){return '<div class="hb" style="grid-template-columns:110px 1fr 90px"><span>'+r[0]+'</span><div class="bar"><i style="width:'+Math.min(100,Math.round(r[1]/mx*100))+'%"></i></div><span style="text-align:right">'+inr(r[1])+'</span></div>'}).join('')+'<p class="muted">Pending with treasury: <b>'+inr(w.billed-w.paid)+'</b>. The MVP tracks bill and payment status; payment initiation comes later.</p>';
 }else if(tab==='complaints'){
  h+='<div class="w360"><div class="card kpi"><small>Open</small><b>'+w.cOpen+'</b></div><div class="card kpi"><small>Resolved</small><b>'+w.cDone+'</b></div></div><p class="muted">Complaints raised from this work\'s QR plate or its location appear here with their SLA state. Several reports of the same spot are merged into one ticket.</p>';
 }else if(tab==='media'){
  h+='<div class="tiles">'+['Site photo, 12 Nov','Site photo, 3 Nov','Inspection photo','Video, 0:42','Complaint photo','Completion photo'].map(function(x){return '<div class="tile">'+x+'</div>'}).join('')+'</div><p class="muted">Sample tiles. Uploads are geotagged, scanned and transcoded in the real system.</p>';
 }else{
  h+='<div class="row" style="align-items:flex-start;flex-wrap:nowrap;gap:16px"><div class="qrbox" style="width:140px;height:140px">'+qr(w.code)+'</div><div style="min-width:0"><dl class="kv"><dt>Status</dt><dd>Active</dd><dt>Link</dt><dd class="mono">r.kmc.example/w/'+btoa(w.code).replace(/[^A-Za-z0-9]/g,'').slice(0,8)+'</dd><dt>Short code</dt><dd class="mono">'+(btoa(w.code).replace(/[^A-Za-z0-9]/g,'').slice(2,10).toUpperCase())+'</dd><dt>Scans, 30 days</dt><dd>'+w.scans+'</dd></dl><div class="row" style="margin-top:10px"><button class="btn sm" data-act="w-plate">Prepare plate</button><button class="btn sm danger" data-act="w-revoke">Revoke code</button></div></div></div><p class="muted">Sample pattern, not a scannable code.</p>';
 }
 m.innerHTML=h+'</div>';m.hidden=false;
}

/* ---------- State dashboard ---------- */
function renderState(){
 var el=$('#v-state'),all=S.tickets.filter(function(t){return t.status!=='rejected'});
 var cnt={};TORDER.forEach(function(s){cnt[s]=all.filter(function(t){return t.status===s}).length});
 var sanctioned=all.reduce(function(a,t){return a+(t.sanctioned||0)},0);
 var max=Math.max.apply(null,TORDER.map(function(s){return cnt[s]}).concat([1]));
 var h='<div class="console"><div class="ctitle"><div><div class="muted">Signed in as State Secretary · scope: West Bengal</div><h2>State roll-up</h2></div></div>';
 h+='<div class="kpis"><div class="card kpi"><small>Open for voting</small><b>'+cnt.open_for_voting+'</b></div><div class="card kpi"><small>With ULBs for review</small><b>'+cnt.ulb_review+'</b></div><div class="card kpi"><small>Awaiting sanction</small><b>'+cnt.awaiting_sanction+'</b></div><div class="card kpi"><small>Sanctioned so far</small><b>'+inr(sanctioned)+'</b></div></div>';
 h+='<div class="grid2"><div class="card panel"><h3>Tickets by stage</h3>'+TORDER.map(function(s){return '<div class="hb"><span>'+TS[s].label+'</span><div class="bar"><i style="width:'+Math.round(cnt[s]/max*100)+'%"></i></div><b style="text-align:right">'+cnt[s]+'</b></div>'}).join('')+'</div>';
 var ulbs=[];all.forEach(function(t){if(ulbs.indexOf(t.ulb)<0)ulbs.push(t.ulb)});
 h+='<div class="card panel"><h3>By urban local body</h3><div class="tblwrap" style="border:0"><table class="t" style="min-width:520px"><thead><tr><th>ULB</th><th class="num">Voting</th><th class="num">Review</th><th class="num">Sanction</th><th class="num">Scheduled or live</th><th class="num">Done</th><th class="num">Longest wait</th></tr></thead><tbody>'+ulbs.map(function(u){
  var c=function(f){return all.filter(function(t){return t.ulb===u&&f(t.status)}).length};
  var wt=all.filter(function(t){return t.ulb===u&&t.status==='awaiting_sanction'}).reduce(function(a,t){return Math.max(a,t.wait)},0);
  return '<tr><td><b>'+u+'</b><br><span class="muted" style="font-size:12px">'+esc(ULBN[u])+'</span></td><td class="num">'+c(function(s){return s==='open_for_voting'})+'</td><td class="num">'+c(function(s){return s==='ulb_review'})+'</td><td class="num">'+c(function(s){return s==='awaiting_sanction'})+'</td><td class="num">'+c(function(s){return s==='scheduled'||s==='in_progress'})+'</td><td class="num">'+c(function(s){return s==='completed'})+'</td><td class="num">'+(wt?(wt>30?'<span class="pill warn">'+wt+'d</span>':wt+'d'):'–')+'</td></tr>';
 }).join('')+'</tbody></table></div></div></div>';
 var Q=all.filter(function(t){return t.status==='awaiting_sanction'}).sort(function(a,b){return b.wait-a.wait});
 h+='<div class="card panel"><h3>Sanction queue</h3><p class="muted" style="margin:-4px 0 10px">Level follows demo cost bands: up to ₹10 lakh District, above that State. Tickets waiting more than 30 days are flagged.</p>';
 h+=Q.length?'<div class="tblwrap" style="border:0"><table class="t"><thead><tr><th>ID</th><th>Ticket</th><th>ULB · ward</th><th class="num">Estimate</th><th>Level</th><th class="num">Votes</th><th class="num">Waiting</th><th></th></tr></thead><tbody>'+Q.map(function(t){
  return '<tr><td class="mono">'+t.id+'</td><td><a href="#" data-act="open-ticket" data-id="'+t.id+'" data-ctx="state">'+esc(t.title)+'</a></td><td>'+t.ulb+' · '+esc(t.ward)+'</td><td class="num">'+inr(t.cost)+'</td><td>'+level(t.cost)+'</td><td class="num">'+t.votes+'</td><td class="num">'+(t.wait>30?'<span class="pill warn">'+t.wait+'d</span>':t.wait+'d')+'</td><td><button class="btn primary sm" data-act="t-sanction" data-id="'+t.id+'">Sanction…</button></td></tr>';
 }).join('')+'</tbody></table></div>':'<p class="empty">The queue is clear. Approve and forward a ticket from the ULB console to see it here.</p>';
 el.innerHTML=h+'</div></div>';
}

/* ---------- scan flow ---------- */
function startScan(code){UI.scan={code:code,step:0,installed:false};renderScan()}
function renderScan(){
 var sc=UI.scan,w=W(sc.code),slug=btoa(w.code).replace(/[^A-Za-z0-9]/g,'').slice(0,8);
 var steps=sc.installed?['The camera opens https://r.kmc.example/w/'+slug,'The verified link opens the app directly (App Links or Universal Links)','The report page opens with work '+w.code+' and its location prefilled']
  :['The camera opens https://r.kmc.example/w/'+slug+' in the browser','A landing page shows the work title and ward, with Install the app and Report in the browser','The store opens. The token travels with it: the Play install referrer on Android, a deferred-link provider or the short code on iOS','First launch reads the token and runs the OTP login','The report page opens with work '+w.code+' and its location prefilled'];
 var last=sc.step>=steps.length-1;
 var m=$('#modal');
 m.innerHTML='<div class="mbox" role="dialog" aria-modal="true" aria-label="QR scan flow"><h3>Scan the plate on '+esc(w.code)+'</h3><label class="row" style="margin-bottom:10px"><input type="checkbox" id="s-inst" '+(sc.installed?'checked':'')+'> The app is already installed on this phone</label><ol class="steps">'+steps.map(function(s,i){return '<li class="'+(i<sc.step?'done':i===sc.step?'on':'')+'">'+esc(s)+'</li>'}).join('')+'</ol><div class="mact"><button class="btn" data-act="close-modal">Close</button><button class="btn primary" data-act="'+(last?'scan-done':'scan-next')+'">'+(last?'Open report page':'Next step')+'</button></div></div>';
 m.hidden=false;
 $('#s-inst').onchange=function(e){UI.scan.installed=e.target.checked;UI.scan.step=0;renderScan()};
}

/* ---------- render + events ---------- */
function view(){var h=(location.hash||'').replace('#','');return h==='ulb'||h==='state'?h:'citizen'}
function render(){
 var v=view();UI.view=v;
 $$('.personas a').forEach(function(a){if(a.dataset.v===v)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
 ['citizen','ulb','state'].forEach(function(n){$('#v-'+n).hidden=n!==v});
 if(v==='citizen')renderCitizen();else if(v==='ulb')renderUlb();else renderState();
 if(UI.drawer)renderDrawer();
 if(UI.w360&&!$('#modal').hidden)render360();
}
document.addEventListener('click',function(e){
 var a=e.target.closest('[data-act]');if(!a)return;
 var act=a.dataset.act,id=a.dataset.id;
 if(a.tagName==='A')e.preventDefault();
 if(act==='reset'){init();closeDrawer();closeModal();render();toast('Sample data restored.');return}
 if(act==='close-drawer'){closeDrawer();return}
 if(act==='close-modal'){UI.w360=null;closeModal();return}
 if(act==='open-ticket'){UI.w360=null;if(!$('#modal').hidden)closeModal();openDrawer(id,a.dataset.ctx||'ulb');return}
 if(act==='vote'){vote(id);render();return}
 if(act==='confirm-done'){var t=T(id);t.confirmed=true;ev(t,'Resident','Resident confirmed the work is done');toast('Thanks. The ticket is closed.');render();return}
 if(act==='c-tab'){UI.cTab=a.dataset.tab;render();return}
 if(act==='c-cat'){UI.cCat=a.dataset.cat;render();return}
 if(act==='c-sort'){UI.cSort=a.dataset.s;render();return}
 if(act==='pick-img'){$('#f-img').click();return}
 if(act==='pick-vid'){$('#f-vid').click();return}
 if(act==='scan'){startScan(a.dataset.code);return}
 if(act==='scan-next'){UI.scan.step++;renderScan();return}
 if(act==='scan-done'){var w=W(UI.scan.code);UI.prefill={state:'West Bengal',district:'Kolkata',ward:w.ward,code:w.code};UI.cTab='report';closeModal();render();return}
 if(act==='demo-votes'){var t2=T(id);t2.votes+=25;checkThreshold(t2);render();return}
 if(act==='u-tab'){UI.uTab=a.dataset.tab;render();return}
 if(act==='sort'){var k=a.dataset.key;if(UI.sortKey===k)UI.sortDir*=-1;else{UI.sortKey=k;UI.sortDir=-1}render();return}
 if(act==='open-work'){closeDrawer();open360(a.dataset.code);return}
 if(act==='w-tab'){UI.w360Tab=a.dataset.tab;render360();return}
 if(act==='w-inspect'){var wk=W(UI.w360);wk.progress=Math.min(100,wk.progress+15);ev(wk,'Ward Engineer','Inspection recorded, progress '+wk.progress+'%');toast('Inspection recorded. Progress is '+wk.progress+'%.');render360();render();return}
 if(act==='w-award'){var wa=W(UI.w360);wa.vendor='Sample Vendor Pvt Ltd';wa.contract=Math.round(wa.sanctioned*0.95/1000)*1000;ev(wa,'Tender Officer','Winning bid recorded: '+wa.vendor+', '+inr(wa.contract));toast('Award recorded. The work can now move to Awarded.');render360();return}
 if(act==='w-plate'){toast('In the real system this produces a printable, weatherproof plate.');return}
 if(act==='w-revoke'){toast('In the real system the code is revoked and a replacement is issued in one step.');return}
 if(act==='t-openvote'){openVoting(T(id));toast(id+' is open for voting.');render();return}
 if(act==='t-fast'||act==='t-approve'||act==='t-reject'||act==='t-sanction'){
  var tt=T(id),kind=act==='t-fast'?'fasttrack':act==='t-approve'?'approve':act==='t-reject'?'reject':'sanction';
  UI.drawerAfter=UI.drawer;askTicket(kind,tt);return;
 }
 if(act==='t-return'){var tr=T(id);tr.status='new';tr.route=null;tr.wait=0;ev(tr,'Commissioner','Returned to review');toast(id+' returned to review.');render();return}
});
document.addEventListener('keydown',function(e){
 if(e.key==='Escape'){if(!$('#modal').hidden){UI.w360=null;closeModal()}else if(UI.drawer)closeDrawer();return}
 if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.tcard,tr.click,.tk h4')){e.preventDefault();e.target.click()}
});
/* drag and drop */
var dragged=null;
document.addEventListener('dragstart',function(e){
 var c=e.target.closest&&e.target.closest('.tcard');if(!c)return;
 dragged={kind:c.dataset.kind,id:c.dataset.id||c.dataset.code};e.dataTransfer.setData('text/plain',dragged.id);e.dataTransfer.effectAllowed='move';
});
document.addEventListener('dragover',function(e){var col=e.target.closest&&e.target.closest('.col');if(col&&dragged&&col.dataset.kind===dragged.kind){e.preventDefault();col.classList.add('over')}});
document.addEventListener('dragleave',function(e){var col=e.target.closest&&e.target.closest('.col');if(col)col.classList.remove('over')});
document.addEventListener('drop',function(e){
 var col=e.target.closest&&e.target.closest('.col');if(!col||!dragged)return;
 e.preventDefault();col.classList.remove('over');var d=dragged;dragged=null;
 if(d.kind==='ticket')moveTicket(d.id,col.dataset.col,'ulb');else moveWork(d.id,col.dataset.col);
});
document.addEventListener('dragend',function(){dragged=null;$$('.col.over').forEach(function(c){c.classList.remove('over')})});
window.addEventListener('hashchange',function(){closeDrawer();render()});
init();render();
})();
</script>

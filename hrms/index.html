<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PeopleOS — Detailed HRMS Forms Prototype</title>
<style>
:root{--bg:#f4f6fb;--panel:#fff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--brand:#4f46e5;--brand2:#7c3aed;--ok:#059669;--warn:#d97706;--bad:#dc2626;--r:14px}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.side{background:#0b1220;color:#cbd5e1;padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:9px;align-items:center;color:#fff;font-weight:800;font-size:17px;margin:2px 5px 16px}
.brand i{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;font-style:normal}
.role{margin:0 5px 14px;padding:9px;border-radius:11px;background:rgba(255,255,255,.06)}
.role label{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:#94a3b8;margin-bottom:5px}
.role select{width:100%;background:#1e293b;color:#fff;border:1px solid #334155;border-radius:8px;padding:7px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;padding:9px 10px;border-radius:9px;font-size:13px;color:#cbd5e1}
.nav button:hover,.nav button.active{background:rgba(255,255,255,.09);color:#fff}
.main{padding:18px 22px}
.top{display:flex;justify-content:space-between;align-items:center;gap:11px;margin-bottom:16px;flex-wrap:wrap}
h1{font-size:20px;margin:0}.sub{color:var(--muted);font-size:12px;margin-top:3px}
.search{flex:1;min-width:180px;max-width:360px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 12px}
.user{display:flex;align-items:center;gap:8px}
.av{width:35px;height:35px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;display:grid;place-items:center;font-weight:700}
.btn{border:0;border-radius:9px;padding:8px 12px;font-weight:700;font-size:12px;cursor:pointer}
.p{background:var(--brand);color:#fff}.g{background:#fff;border:1px solid var(--line);color:var(--ink)}.d{background:#fee2e2;color:#b91c1c}.s{background:#ecfdf5;color:#047857}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:15px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.k{font-size:11px;color:var(--muted)}.v{font-size:22px;font-weight:800;margin:5px 0 2px}.d2{font-size:11px;color:var(--ok)}
.grid{display:grid;grid-template-columns:1.55fr 1fr;gap:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.panel h2{font-size:14px;margin:0 0 10px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;color:var(--muted);padding:7px;font-weight:600;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid #f1f5f9}
.pill{padding:3px 7px;border-radius:999px;font-size:10px;font-weight:700;white-space:nowrap}
.ok{background:#ecfdf5;color:#047857}.warn{background:#fffbeb;color:#b45309}.bad{background:#fef2f2;color:#b91c1c}.info{background:#eef2ff;color:#4338ca}.mut{background:#f1f5f9;color:#475569}
.bar{height:7px;border-radius:999px;background:#eef2ff;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2))}
.row{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid #f1f5f9;font-size:12px}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;place-items:center;padding:14px;z-index:50}
.modal.open{display:grid}.dialog{background:#fff;border-radius:15px;padding:18px;width:min(860px,100%);max-height:94vh;overflow:auto}
.f{margin-bottom:10px}.f label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px}
.f .err{color:var(--bad);font-size:10.5px;margin-top:3px;display:none}
.f.invalid input,.f.invalid select,.f.invalid textarea{border-color:var(--bad)}
.f.invalid .err{display:block}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.actions{display:flex;justify-content:space-between;gap:7px;margin-top:13px;flex-wrap:wrap}
.right{display:flex;gap:7px}
.tabs{display:flex;gap:6px;margin-bottom:11px;flex-wrap:wrap}
.tab{padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:12px}
.tab.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.empty{text-align:center;color:var(--muted);padding:18px}
.toast{position:fixed;right:14px;bottom:14px;background:#0f172a;color:#fff;padding:10px 14px;border-radius:9px;opacity:0;pointer-events:none;transition:.25s;z-index:60}
.toast.show{opacity:1}
.kv{font-size:12px;padding:7px 0;border-bottom:1px solid #f1f5f9}.kv b{display:block;color:var(--muted);font-size:10px;font-weight:600;margin-bottom:2px}
.timeline{border-left:2px solid #e2e8f0;margin-left:6px;padding-left:12px}
.tl{position:relative;padding-bottom:11px}.tl:before{content:'';position:absolute;left:-18px;top:4px;width:8px;height:8px;border-radius:50%;background:var(--brand)}
.tl b{font-size:12px}.tl span{display:block;color:var(--muted);font-size:11px}
.wizard{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.step{padding:6px 11px;border-radius:999px;background:#f1f5f9;font-size:11.5px}
.step.active{background:var(--brand);color:#fff}
.step.done{background:#ecfdf5;color:#047857}
.kanban{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.kcol{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:8px;min-height:150px}
.kcol h4{margin:0 0 7px;font-size:11.5px;color:var(--muted)}
.kcard{background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px;margin-bottom:6px;font-size:11.5px}
.notif{display:flex;gap:9px;padding:8px 0;border-bottom:1px solid #f1f5f9;font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--brand);margin-top:5px}
.chat{background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:11px}
.bubble{background:#fff;border:1px solid var(--line);border-radius:11px;padding:9px;margin-bottom:7px;font-size:12px}
.bubble.ai{background:#eef2ff;border-color:#c7d2fe}
@media(max-width:1000px){.app{grid-template-columns:1fr}.side{position:relative;height:auto}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.kanban{grid-template-columns:repeat(2,1fr)}.two,.three{grid-template-columns:1fr}}
</style>
</head>

function field(label,id,type='text',ph='',required=false,val=''){return `<div class="f" id="wrap-${id}"><label>${label}${required?' *':''}</label><input id="${id}" type="${type}" placeholder="${ph}" value="${val}"><div class="err">This field is required</div></div>`}
function selectField(label,id,options,required=false){return `<div class="f" id="wrap-${id}"><label>${label}${required?' *':''}</label><select id="${id}">${options.map(o=>`<option>${o}</option>`).join('')}</select><div class="err">Please select an option</div></div>`}
function areaField(label,id,ph='',required=false){return `<div class="f" id="wrap-${id}"><label>${label}${required?' *':''}</label><textarea id="${id}" rows="3" placeholder="${ph}"></textarea><div class="err">This field is required</div></div>`}
function validate(ids){let ok=true;ids.forEach(id=>{const el=document.getElementById(id),w=document.getElementById('wrap-'+id);if(!el||!w)return;if(!el.value.trim()){w.classList.add('invalid');ok=false}else w.classList.remove('invalid')});return ok}

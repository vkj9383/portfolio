<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>BankCore Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: persistent left rail of modules, one working pane. Role switcher in the top bar drives every permission check. */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --ink:#0E1A2B; --muted:#5B6778; --line:#D8DEE6;
  --accent:#0F5FA8; --accent-ink:#FFFFFF; --tint:#E6EEF7;
  --good:#1B7F4B; --warn:#A66300; --bad:#B3261E; --gold:#8A6A0E;
  --good-bg:#E3F3EA; --warn-bg:#FBEFD9; --bad-bg:#FBE5E3; --gold-bg:#F6EDCF;
  --font:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C131C; --surface:#131C28; --ink:#E7EDF4; --muted:#94A3B5; --line:#243142;
  --accent:#5AA2E6; --accent-ink:#07121F; --tint:#16263A;
  --good:#4CC38A; --warn:#E0A24A; --bad:#F0827A; --gold:#D9B24C;
  --good-bg:#123123; --warn-bg:#35270F; --bad-bg:#3A1A18; --gold-bg:#33290D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C131C; --surface:#131C28; --ink:#E7EDF4; --muted:#94A3B5; --line:#243142;
  --accent:#5AA2E6; --accent-ink:#07121F; --tint:#16263A;
  --good:#4CC38A; --warn:#E0A24A; --bad:#F0827A; --gold:#D9B24C;
  --good-bg:#123123; --warn-bg:#35270F; --bad-bg:#3A1A18; --gold-bg:#33290D; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
h2{font-size:18px} h3{font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding-block:12px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-size:17px;letter-spacing:.2px}
.brand span{color:var(--muted);font-size:12px}
.who{display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{background:none;border:0;padding:6px 11px;cursor:pointer;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:500}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.who label{color:var(--muted);font-size:12px}
select,input,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0;max-width:100%}
select:focus-visible,input:focus-visible,button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.layout{display:grid;grid-template-columns:200px minmax(0,1fr);gap:20px;padding-block:18px}
nav{display:flex;flex-direction:column;gap:2px;position:sticky;top:64px;align-self:start}
nav button{text-align:left;background:none;border:0;border-radius:6px;padding:8px 10px;cursor:pointer;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
nav button:hover{background:var(--tint);color:var(--ink)}
nav button[aria-current="true"]{background:var(--tint);color:var(--accent);font-weight:600}
nav .n{font-family:var(--mono);font-size:11px;background:var(--accent);color:var(--accent-ink);border-radius:9px;padding:0 6px;align-self:center}
main{min-width:0;display:flex;flex-direction:column;gap:16px}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:end}
.head p{margin:2px 0 0;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.kpi small{color:var(--muted);display:block}
.kpi b{font-size:20px;font-variant-numeric:tabular-nums;font-weight:600}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.mono{font-family:var(--mono);font-size:12px}
.num{text-align:right;white-space:nowrap}
.pill{display:inline-block;border-radius:10px;padding:1px 8px;font-size:12px;background:var(--tint);color:var(--accent);white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.gold{background:var(--gold-bg);color:var(--gold)} .pill.mute{background:var(--line);color:var(--muted)}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:500}
.btn.ghost{background:none;color:var(--accent);border:1px solid var(--line)}
.btn.bad{background:var(--bad);color:#fff}
.btn.sm{padding:3px 9px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
form{display:grid;gap:10px}
.f{display:grid;gap:3px}
.f label{font-size:12px;color:var(--muted)}
.two{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.note{color:var(--muted);font-size:12px}
.lock{background:var(--tint);border-radius:6px;padding:8px 10px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.list{display:grid;gap:10px}
.item{border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:8px;min-width:0}
.item.sel{border-color:var(--accent);background:var(--tint)}
.split{display:grid;gap:16px;grid-template-columns:minmax(0,320px) minmax(0,1fr)}
.pre{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;font-family:var(--mono);font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.ok{color:var(--good)} .badc{color:var(--bad)}
.lnk{color:var(--accent);text-decoration:none;cursor:pointer}.lnk:hover{text-decoration:underline}
.crumb{font-size:12px;color:var(--muted)}
.cdet{display:grid;gap:16px;grid-template-columns:minmax(0,1fr) 320px;align-items:start}
.col{display:grid;gap:16px;min-width:0}
.kv{display:grid;grid-template-columns:104px minmax(0,1fr);gap:8px 10px;margin:10px 0 0}.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}
.tl{list-style:none;margin:12px 0 0;padding:0 0 0 12px;border-left:2px solid var(--line);display:grid;gap:14px}
.tl li{position:relative;padding-left:14px}
.tl li::before{content:"";position:absolute;left:-19px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.tl li.payment::before{border-color:var(--good)}.tl li.grievance::before{border-color:var(--warn)}.tl li.compliance::before{border-color:var(--bad)}.tl li.other::before{border-color:var(--muted)}
tr.clk{cursor:pointer}tr.clk:hover td,tr.on td{background:var(--tint)}
.cr{color:var(--good)}
.bal{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
@media (max-width:980px){.cdet{grid-template-columns:minmax(0,1fr)}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;z-index:20;max-width:min(92vw,520px);box-shadow:0 4px 18px rgba(0,0,0,.25)}
#toast.bad{background:var(--bad);color:#fff}
@media (max-width:820px){
  .layout{grid-template-columns:minmax(0,1fr);gap:10px}
  nav{position:static;flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  nav button{white-space:nowrap}
  .split{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:no-preference){.btn{transition:filter .15s}.btn:hover{filter:brightness(1.08)}}
</style>

<div class="top">
  <div class="brand"><b>BankCore</b><span>Core Banking and Lending prototype. Sample data, resets on reload.</span></div>
  <div class="who"><div class="seg" id="theme" role="group" aria-label="Colour theme"><button type="button" data-theme-set="light" aria-pressed="false">Light</button><button type="button" data-theme-set="dark" aria-pressed="false">Dark</button><button type="button" data-theme-set="system" aria-pressed="true">System</button></div><label for="role">Signed in as</label><select id="role"></select></div>
</div>
<div class="layout">
  <nav id="nav" aria-label="Modules"></nav>
  <main id="main"></main>
</div>
<div id="toast" hidden></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr=n=>'₹'+Number(n).toLocaleString('en-IN',{maximumFractionDigits:2,minimumFractionDigits:Number.isInteger(+n)?0:2});
const tmy=d=>new Date(d).toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Asia/Kolkata'});
const tm=d=>new Date(d).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Asia/Kolkata'});
const dt=d=>new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric',timeZone:'Asia/Kolkata'});
function h53(str,seed=0){let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return(4294967296*(2097151&h2)+(h1>>>0)).toString(16).padStart(14,'0')}
const rnd=n=>Array.from({length:n},()=>Math.floor(Math.random()*10)).join('');

/* ---------- roles and permissions ---------- */
const PERM_LABEL={'customers.view':'View customers','customers.edit':'Edit customers','accounts.manage':'Open and freeze accounts','pii.full':'See full PAN and phone','payments.view':'View payments','payments.create':'Initiate payments','payments.approve':'Approve payments (checker)','aml.review':'Clear AML holds','loans.view':'View loans','loans.create':'Create loan applications','loans.sanction':'Sanction loans','loans.disburse':'Disburse loans','vault.view':'View vaults','vault.cash':'Request cash movements','vault.custodian':'Vault custodian (dual control)','forex.view':'View forex','forex.deal':'Create remittances','grievance.view':'View grievances','grievance.create':'Register grievances','grievance.manage':'Assign, escalate, resolve grievances','audit.read':'Read audit trail'};
const ROLES={
  teller:{name:'Ravi Gupta',title:'Teller',perms:['customers.view','payments.view','payments.create','vault.view','vault.cash','grievance.view']},
  cso:{name:'Priya Nandi',title:'Customer service officer',perms:['customers.view','customers.edit','accounts.manage','payments.view','payments.create','loans.view','grievance.view','grievance.create']},
  loan:{name:'Sourav Ghosh',title:'Loan officer',perms:['customers.view','loans.view','loans.create']},
  checker:{name:'Debjani Roy',title:'Operations officer (checker)',perms:['customers.view','payments.view','payments.approve','loans.view','loans.disburse','vault.view','vault.custodian','grievance.view']},
  manager:{name:'Arup Banerjee',title:'Branch manager',perms:['customers.view','pii.full','accounts.manage','payments.view','payments.create','payments.approve','loans.view','loans.create','loans.sanction','loans.disburse','vault.view','vault.cash','vault.custodian','forex.view','grievance.view','grievance.create','grievance.manage','audit.read']},
  forex:{name:'Imran Sheikh',title:'Forex dealer',perms:['customers.view','payments.view','forex.view','forex.deal']},
  compliance:{name:'Kavita Rao',title:'Compliance and AML officer',perms:['customers.view','pii.full','accounts.manage','payments.view','loans.view','aml.review','grievance.view','audit.read']},
  auditor:{name:'Neel Chatterjee',title:'Internal auditor (read only)',perms:['customers.view','payments.view','loans.view','vault.view','forex.view','grievance.view','audit.read']}
};
const NAV=[['dash','Dashboard',null],['cust','Customers','customers.view'],['acct','Accounts','customers.view'],['txn','Transactions','payments.view'],['pay','Payments','payments.view'],['loan','Loans','loans.view'],['vault','Vaults','vault.view'],['fx','Forex and SWIFT','forex.view'],['grv','Grievances','grievance.view'],['aud','Audit and chain','audit.read'],['roles','Staff and roles','customers.view'],['ins','Insurance','customers.view',1],['mf','Mutual funds','customers.view',1],['pen','Pension','customers.view',1]];

/* ---------- state ---------- */
const S={role:'manager',view:'dash',cust:'C1',seq:100,openSched:null,openMsg:null,
 branches:[{n:'Park Street, Kolkata (main)',ifsc:'SMPL0000101',micr:'700123101',bic:'SMPLINBBXXX',svc:'Forex, gold, locker'},{n:'Salt Lake Sector V',ifsc:'SMPL0000102',micr:'700123102',bic:'SMPLINBB102',svc:'Forex, locker'},{n:'Howrah Maidan',ifsc:'SMPL0000103',micr:'711123103',bic:'n/a',svc:'Gold, locker'}],
 customers:[
  {id:'C1',name:'Anita Sen',type:'Individual',pan:'ABCPS1234K',phone:'+91 98300 11122',risk:'Low',kyc:'Verified',score:782,income:85000,emi:0},
  {id:'C2',name:'Rahul Mukherjee',type:'Individual',pan:'BXQPM5521L',phone:'+91 98310 22233',risk:'Medium',kyc:'Verified',score:694,income:52000,emi:9000},
  {id:'C3',name:'Sunrise Textiles Pvt Ltd',type:'Corporate',pan:'AAJCS8841Q',phone:'+91 33 4000 7788',risk:'Medium',kyc:'Verified',score:731,income:900000,emi:150000},
  {id:'C4',name:'Meera Das',type:'Individual',pan:'CKLPD3390M',phone:'+91 98320 33344',risk:'Low',kyc:'Refresh due',score:640,income:38000,emi:0}],
 accounts:[{no:'10010001',cust:'C1',type:'Savings',bal:245000.5},{no:'10010003',cust:'C2',type:'Savings',bal:68250},{no:'10010004',cust:'C3',type:'Current',bal:1850000},{no:'10010005',cust:'C4',type:'Savings',bal:15400}],
 payments:[],loans:[],swift:[],lrs:{},
 vault:{cash:{500:1200,200:800,100:1500,50:900,20:600,10:500},gold:[{no:'GP-1001',loan:'GL-0007',cust:'C1',grams:42.5,karat:22,slot:'A-01',status:'In vault'},{no:'GP-1002',loan:'GL-0009',cust:'C2',grams:31,karat:22,slot:'A-02',status:'In vault'}],moves:[]},
 grv:[{id:'G1',cust:'C2',cat:'Failed transaction',text:'UPI payment debited but beneficiary not credited.',opened:Date.now()-30*3600e3,sla:24,level:1,owner:'Unassigned',status:'Open'},{id:'G2',cust:'C4',cat:'Charges dispute',text:'SMS charges applied twice last quarter.',opened:Date.now()-5*3600e3,sla:72,level:1,owner:'Priya Nandi',status:'Open'}],
 audit:[],anchors:[],tampered:null,txns:[],hist:[],custOpen:null,acctOpen:null,txSel:null,txType:'all',txRail:'all',txAcct:'all',txQ:'',cuQ:'',evFilter:'all'};
const RATES={USD:[84.6,85.4],EUR:[91.2,92.4],GBP:[107.1,108.6],AED:[23.0,23.4],SGD:[62.8,63.6]};
const PRODUCTS={personal:{label:'Personal loan',rate:12.5,max:2500000,minT:6,maxT:60},corporate:{label:'Corporate term loan',rate:11,max:50000000,minT:12,maxT:120},gold:{label:'Gold loan',rate:9.5,max:5000000,minT:3,maxT:12,dt:12,da:150000},home:{label:'Home loan',rate:8.75,max:50000000,minT:60,maxT:360,dt:240,da:4500000},od:{label:'Overdraft limit',rate:11.5,max:5000000,minT:12,maxT:12,dt:12,da:1000000}};
PRODUCTS.personal.dt=24;PRODUCTS.personal.da=400000;PRODUCTS.corporate.dt=60;PRODUCTS.corporate.da=2500000;
const LOAN_OPEN=['Credit review','Valuation','Legal','Sanctioned'];

const can=p=>ROLES[S.role].perms.includes(p);
const me=()=>ROLES[S.role];
const actor=()=>me().name+' ('+me().title+')';
const cust=id=>S.customers.find(c=>c.id===id)||{name:'Unknown'};
const accOf=id=>S.accounts.find(a=>a.cust===id);
const nextId=()=>++S.seq;

/* ---------- audit trail with hash chain and anchors ---------- */
function entryHash(prev,e){return h53(prev+'|'+e.n+'|'+e.actor+'|'+e.action+'|'+e.entity+'|'+e.detail)}
function log(action,entity,detail,c){
  const prev=S.audit.length?S.audit[S.audit.length-1].hash:'genesis';
  const e={n:S.audit.length+1,ts:Date.now(),actor:S.audit.length?actor():'System',action,entity,detail,cust:c||null,prev};
  e.hash=entryHash(prev,e);S.audit.push(e);
  if(e.n%5===0){const slice=S.audit.slice(e.n-5,e.n);S.anchors.push({id:S.anchors.length+1,from:e.n-4,to:e.n,root:h53(slice.map(x=>x.hash).join('')),at:Date.now()})}
}
function verify(){
  let prev='genesis';
  for(const e of S.audit){if(entryHash(prev,e)!==e.hash)return{ok:false,at:e.n};prev=e.hash}
  for(const a of S.anchors){const slice=S.audit.slice(a.from-1,a.to);if(h53(slice.map(x=>x.hash).join(''))!==a.root)return{ok:false,at:a.from,anchor:a.id}}
  return{ok:true};
}
log('boot','system','Prototype session started');

function post(a,dir,amt,desc,ref,rail){const t={id:'T'+(S.txns.length+1000),ts:Date.now(),acct:a.no,cust:a.cust,dir,amount:amt,desc,ref:ref||'',rail:rail||'Internal',bal:a.bal};S.txns.push(t);return t}
const clink=id=>`<a href="#" class="lnk" data-open-cust="${id}">${esc(cust(id).name)}</a>`;
const alink=no=>`<a href="#" class="lnk" data-open-acct="${no}">${no}</a>`;
/* ---------- helpers ---------- */
const pill=(t,k='')=>`<span class="pill ${k}">${esc(t)}</span>`;
const stKind=s=>({Completed:'good',Active:'good',Sent:'good','In vault':'good',Signed:'good',Resolved:'good',Verified:'good',Low:'good',Sanctioned:'',Medium:'warn','Pending approval':'warn','Credit review':'warn',Valuation:'warn',Legal:'warn','Queued NEFT':'warn',Pending:'warn','Pending release':'warn',Open:'warn','Refresh due':'warn',Frozen:'bad','AML hold':'bad',Rejected:'bad',Declined:'bad',High:'bad',Released:'mute'}[s]||'');
const tbl=(h,rows)=>`<div class="scroll"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.join('')||`<tr><td colspan="${h.length}" class="note">Nothing here yet.</td></tr>`}</tbody></table></div>`;
function toast(m,bad){const t=$('#toast');t.textContent=m;t.className=bad?'bad':'';t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3800)}
const custOpts=()=>S.customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
const accOpts=()=>S.accounts.map(a=>`<option value="${a.no}">${a.no} · ${esc(cust(a.cust).name)} · ${inr(a.bal)}${a.status==='Frozen'?' · FROZEN':''}</option>`).join('');
const maskPan=p=>can('pii.full')?p:p.slice(0,2)+'•••••'+p.slice(-1);
const maskPh=p=>can('pii.full')?p:p.slice(0,-4).replace(/\d/g,'•')+p.slice(-4);
const lockMsg=p=>`<div class="lock">Your role (${esc(me().title)}) cannot do this. Needs: ${esc(PERM_LABEL[p])}. Switch role at the top to try it.</div>`;
const emi=(P,rate,n)=>{const r=rate/1200;return P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1)};

/* ---------- views ---------- */
function pendingCount(){
  return S.payments.filter(p=>['Pending approval','AML hold'].includes(p.status)).length+S.swift.filter(s=>s.status==='Pending release').length+S.loans.filter(l=>LOAN_OPEN.includes(l.status)).length+S.vault.moves.filter(m=>m.status==='Pending').length;
}
function vDash(){
